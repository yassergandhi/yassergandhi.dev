<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Tu negocio no empezó con una página.</title>
  <desc id="desc">Empezó con una vida que alguien quería construir. Primero pregunto, después reconstruyo y sólo entonces construyo.</desc>
  <rect width="1200" height="630" fill="#170411" />
  <circle cx="990" cy="90" r="360" fill="#300A24" opacity=".95" />
  <circle cx="150" cy="610" r="330" fill="#7A2050" opacity=".28" />
  <line x1="86" y1="94" x2="1114" y2="94" stroke="#E95420" stroke-width="4" />
  <text x="86" y="158" fill="#F5F0F0" font-family="Ubuntu, Arial, sans-serif" font-size="52" font-weight="700">TU NEGOCIO NO EMPEZÓ</text>
  <text x="86" y="222" fill="#F5F0F0" font-family="Ubuntu, Arial, sans-serif" font-size="52" font-weight="700">CON UNA PÁGINA.</text>
  <text x="90" y="342" fill="#E95420" font-family="Ubuntu Mono, monospace" font-size="30">Empezó con una vida</text>
  <text x="90" y="386" fill="#E95420" font-family="Ubuntu Mono, monospace" font-size="30">que alguien quería construir.</text>
  <text x="90" y="470" fill="#F5F0F0" font-family="Ubuntu Mono, monospace" font-size="23">Primero pregunto. Después reconstruyo.</text>
  <text x="90" y="506" fill="#F5F0F0" font-family="Ubuntu Mono, monospace" font-size="23">Sólo entonces construyo.</text>
  <text x="90" y="548" fill="#C8C0C5" font-family="Ubuntu Mono, monospace" font-size="28" letter-spacing="2">yassergandhi.dev_</text>
</svg>
